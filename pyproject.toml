[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "since-dev"
version = "0.1.2"
description = "Find the code in a repository that is about to stop working: retired model IDs, runtimes past end of life, breaking dependency changes. Each with its date, its line and its replacement."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Nabil A", email = "support@since.dev" }]
keywords = ["deprecation", "end-of-life", "breaking-changes", "dependencies", "ai-models", "mcp", "cli", "continuous-maintenance"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://since.dev"
Documentation = "https://since.dev/docs#cli"
Source = "https://github.com/Since-dev/cli"
Issues = "https://github.com/Since-dev/cli/issues"

[project.scripts]
since = "since_dev.__main__:main"
since-dev = "since_dev.__main__:main"

[tool.setuptools]
packages = ["since_dev"]
